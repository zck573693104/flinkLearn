<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070c">
<title>SQL 字段级血缘</title>
<!-- 内联 SVG 图标：这是个离线跑的本地工具，不为一个 favicon 去多要一次请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2305070c'/%3E%3Cpath d='M6 6h6M12 18h6M6 12h12' stroke='%23cbf24a' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='5' cy='6' r='2.3' fill='%234fd6c4'/%3E%3Ccircle cx='5' cy='18' r='2.3' fill='%23ffcb52'/%3E%3Ccircle cx='19' cy='12' r='2.5' fill='%23cbf24a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/cytoscape.min.js"></script>
</head>
<body>
<div class="loadbar" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>SQL 血缘<small>column lineage console</small></h1>
  </div>
  <p id="status" class="status" role="status"></p>
  <dl id="overview" class="stats"></dl>
  <div class="tools">
    <label class="field">深度
      <input id="depth" type="number" min="1" max="8" value="2">
    </label>
    <label class="field">语料目录
      <input id="scan-dir" type="text" placeholder="留空=服务配置的 lineage.scan-dir">
    </label>
    <button id="rescan" type="button">重扫目录</button>
    <button id="export-png" type="button">导出 PNG</button>
    <button id="export-json" type="button">导出 JSON</button>
  </div>
</header>

<p id="scan-error" class="banner" role="alert" hidden></p>

<main class="grid">
  <aside class="col left">
    <nav class="tabs" id="left-tabs" aria-label="左栏视图">
      <button type="button" data-tab="tables" class="active">表</button>
      <button type="button" data-tab="issues">质量</button>
      <button type="button" data-tab="parse">试解析</button>
    </nav>

    <section id="panel-tables" class="panel">
      <input id="search" type="search" placeholder="搜索表名（子串，大小写不敏感）" autocomplete="off">
      <div class="filters">
        <label class="field">层
          <select id="layer-filter"><option value="">全部</option></select>
        </label>
        <label class="check"><input id="only-unresolved" type="checkbox">只看有质量问题</label>
      </div>
      <ul id="table-list" class="list"></ul>
      <p id="table-note" class="note"></p>
    </section>

    <section id="panel-issues" class="panel hidden">
      <ul id="issues" class="issues"></ul>
    </section>

    <section id="panel-parse" class="panel hidden">
      <textarea id="parse-sql" rows="8" placeholder="粘贴一条 INSERT / CREATE TABLE AS SELECT"></textarea>
      <button id="parse-run" type="button">解析并画到图上</button>
      <p class="note">解析结果只在内存里，不进快照；画完可用中栏「试解析·表级 / 试解析·字段」来回切。</p>
      <div id="parse-out" class="parse-out"></div>
    </section>
  </aside>

  <section class="col center">
    <nav class="tabs" id="view-tabs" aria-label="图视图">
      <button type="button" data-view="table" class="active">表级 DAG</button>
      <button type="button" data-view="column">字段链路</button>
      <button type="button" data-view="parsed-table" id="tab-parsed-table" disabled>试解析·表级</button>
      <button type="button" data-view="parsed-column" id="tab-parsed-column" disabled>试解析·字段</button>
    </nav>
    <div class="graph-head">
      <span id="graph-title" class="graph-title">全量血缘（未选表）</span>
      <label class="field">方向
        <select id="direction">
          <option value="both">双向</option>
          <option value="up">只看来源</option>
          <option value="down">只看下游</option>
        </select>
      </label>
    </div>
    <div class="canvas">
      <div id="graph"></div>
      <!-- 字段链路不画在 cytoscape 上：DOM 摆盒、一层 SVG 走线，盒高交给浏览器排版 -->
      <div id="sqlflow" hidden></div>
      <!-- 定位搜索：只在字段视图出现，盒子多了以后"找到那一格"不能靠肉眼 -->
      <div id="sqlflow-locate" class="locate" hidden>
        <input id="locate-input" list="locate-items" placeholder="定位表或字段…"
               autocomplete="off" aria-label="定位表或字段">
        <datalist id="locate-items"></datalist>
      </div>
      <!-- 告警写在画布外面就会改变画布高度，而 fit 的结论正是"这个高度装不下"：只能叠在画布上 -->
      <span id="graph-warn" class="warn" role="status"></span>
      <!-- 动作条钉在角落：它跟着某一行的话，裁剪/缩放/换图每一样都能把它带偏 -->
      <div id="sqlflow-bar" class="bar" role="toolbar" aria-label="字段动作" hidden>
        <span class="bar-grip" aria-hidden="true">⠿</span>
        <p class="bar-title"></p>
        <div class="bar-tools">
          <button type="button" data-bar="chain">只看这一列</button>
          <button type="button" data-bar="columns">列出字段</button>
          <button type="button" data-bar="reset">复位</button>
          <button type="button" data-bar="close" class="close" aria-label="关闭">×</button>
        </div>
      </div>
    </div>
    <div id="legend" class="legend"></div>
  </section>

  <aside class="col right">
    <div id="detail" class="detail">
      <p class="empty">点图中的表节点看字段清单，点字段边看逐跳来源证据。</p>
    </div>
  </aside>
</main>

<script type="module" src="/js/main.js"></script>
</body>
</html>
