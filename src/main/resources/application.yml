server:
  port: 8080

spring:
  application:
    name: flink-lineage-tracker
  
  datasource:
    url: jdbc:mysql://localhost:3306/flink_lineage?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: FlinkLineageDbPool
      max-lifetime: 1800000
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bigdata.lineage.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.bigdata.lineage: DEBUG
    com.github.jsqlparser: WARN
