server:
  port: 8080

spring:
  application:
    name: cep-dynamic-loading-system
  
  # H2 Database Configuration (Development)
  datasource:
    url: jdbc:h2:mem:cepdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # H2 Console (Optional, for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.bigdata.cep: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# CEP 配置
cep:
  rule:
    # 规则存储路径（可选，用于持久化）
    storage-path: ./data/rules
    # 自动重载间隔（秒）
    auto-refresh-interval: 30
  metrics:
    # 指标采集间隔（秒）
    collection-interval: 10
    # 最大保留记录数
    max-records: 10000
